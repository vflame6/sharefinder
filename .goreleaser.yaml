version: 2

project_name: sharefinder

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - "386"
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/vflame6/sharefinder/cmd.VERSION={{.Tag}}

# Archive and checksum names stay as in earlier releases
# (sharefinder_<version>_<os>_<arch>.tar.gz, sharefinder_<version>_checksums.txt)
# so download scripts keep working.
archives:
  - formats: [tar.gz]

# Release notes are written by hand in CHANGELOG.md and passed with
# --release-notes by the release workflow. Do not set changelog.disable: it
# also skips loading --release-notes and leaves the release body empty.

# Homebrew cask in this repository's Casks/ directory, so the repository is
# its own tap:
#   brew tap vflame6/sharefinder https://github.com/vflame6/sharefinder
#   brew install --cask vflame6/sharefinder/sharefinder
# Each release commits the updated cask to main with the release workflow's
# GITHUB_TOKEN; prereleases leave it alone.
homebrew_casks:
  - name: sharefinder
    repository:
      owner: vflame6
      name: sharefinder
      branch: main
    directory: Casks
    commit_msg_template: "build: update the Homebrew cask to {{ .Tag }}"
    homepage: https://github.com/vflame6/sharefinder
    description: Network share discovery tool for SMB networks and domains
    license: MIT
    binaries:
      - sharefinder
    skip_upload: auto
    hooks:
      post:
        # the binary is not notarized: remove the quarantine attribute macOS
        # sets on downloads, as GoReleaser documents for unsigned binaries
        install_steps: |
          if OS.mac?
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/sharefinder"]
          end

dockers_v2:
  - images:
      - ghcr.io/vflame6/sharefinder
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.release
    labels:
      org.opencontainers.image.source: https://github.com/vflame6/sharefinder
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: MIT
