name: Feature request
description: Suggest an idea for sharefinder
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in a test where sharefinder falls short
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like sharefinder to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other tools or workarounds you use today
