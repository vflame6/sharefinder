name: CI

# Pull requests only: what reaches main was tested in its pull request, and
# commits pushed to main directly, such as the Homebrew cask the release
# writes, run no CI.
on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: gofmt and go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: go test
        run: go test -race -coverprofile=cover.out ./...
      - name: coverage
        run: go tool cover -func=cover.out | tail -1

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  windows:
    name: go test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: go test
        run: go test ./...

  # Every target .goreleaser.yaml builds. No code is specific to macOS, so
  # building and vetting for darwin here stands in for a macOS runner.
  cross:
    name: cross-compile release targets
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: go build
        run: |
          for target in linux/386 linux/amd64 linux/arm64 windows/386 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            echo "$target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
          done
      - name: go vet (darwin)
        run: GOOS=darwin GOARCH=arm64 go vet ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t sharefinder:ci .
      - name: smoke test
        run: docker run --rm sharefinder:ci --version
