<script>
(function () {
    'use strict';

    // Every value below comes from the JSON blocks and reaches the page through
    // textContent or DataTable.render.text(): names are data, never markup.
    function block(id) {
        return JSON.parse(document.getElementById(id).textContent);
    }
    var summary = block('sf-summary');
    var hosts = block('sf-hosts');
    var shares = block('sf-shares');
    var files = block('sf-files');

    function setText(id, value) {
        document.getElementById(id).textContent = String(value);
    }

    function humanSize(s) {
        var sizes = ['B', 'kB', 'MB', 'GB', 'TB', 'PB', 'EB'];
        if (s < 1000) {
            return s + ' B';
        }
        var e = Math.min(Math.floor(Math.log(s) / Math.log(1000)), sizes.length - 1);
        var val = s / Math.pow(1000, e);
        return (val < 10 ? val.toFixed(1) : val.toFixed(0)) + ' ' + sizes[e];
    }

    function shortTime(iso) {
        return iso ? iso.replace('T', ' ').replace('Z', '') : '';
    }

    // summary
    var meta = 'sharefinder ' + (summary.version || '') + ' · ' + shortTime(summary.start) + ' – ' +
        (summary.end ? shortTime(summary.end) : 'unfinished') + ' UTC';
    if (summary.identity) {
        meta += ' · as ' + summary.identity;
    }
    setText('sf-meta', meta);
    if (summary.command) {
        setText('sf-command', 'sharefinder ' + summary.command);
        document.getElementById('sf-command-box').hidden = false;
    }
    var warnings = [];
    if (!summary.complete) {
        warnings.push('The scan did not finish: this report shows what was written before it stopped.');
    } else if (summary.interrupted) {
        warnings.push('The scan was interrupted: results are partial.');
    }
    if (summary.skipped > 0) {
        warnings.push(summary.skipped + ' unreadable line(s) of the scan file were skipped.');
    }
    warnings.forEach(function (text) {
        var div = document.createElement('div');
        div.className = 'alert alert-warning py-2';
        div.textContent = text;
        document.getElementById('sf-warnings').appendChild(div);
    });
    ['hosts', 'shares', 'readable', 'writable', 'admin', 'files'].forEach(function (name) {
        setText('sf-count-' + name, Number(summary[name]).toLocaleString('en-US'));
    });

    var text = DataTable.render.text();

    // badge renders a boolean column: fixed labels only, so no data is markup
    function badge(yes, no, yesClass, noClass) {
        return function (data, type) {
            var label = data === true ? yes : data === false ? no : 'Unknown';
            if (type !== 'display') {
                return label;
            }
            var cls = data === true ? yesClass : data === false ? noClass : 'text-bg-light text-muted border';
            return '<span class="badge ' + cls + '">' + label + '</span>';
        };
    }

    function size(data, type) {
        return type === 'display' || type === 'filter' ? humanSize(data) : data;
    }

    function date(data, type) {
        return type === 'display' || type === 'filter' ? shortTime(data) : data;
    }

    new DataTable('#table-hosts', {
        data: hosts,
        lengthMenu: [[20, 100, -1], [20, 100, 'All']],
        columns: [
            {type: 'string', render: text},
            {type: 'string', render: text},
            {type: 'string', render: text},
            {type: 'string', render: text},
            {type: 'string', render: badge('Required', 'Not required', 'text-bg-success', 'text-bg-warning')},
            {type: 'string', render: text},
            {type: 'string', render: text},
            {type: 'string', render: badge('Yes', 'No', 'text-bg-danger', 'text-bg-secondary')},
            {type: 'num'},
            {type: 'string', render: text}
        ]
    });

    new DataTable('#table-shares', {
        data: shares,
        lengthMenu: [[20, 100, -1], [20, 100, 'All']],
        columns: [
            {type: 'string', render: text},
            {type: 'string', render: text},
            {type: 'string', render: text},
            {type: 'string', render: text},
            {type: 'string', render: text},
            {type: 'string', render: badge('Yes', 'No', 'text-bg-warning', 'text-bg-light border')},
            {type: 'string', render: badge('Yes', 'No', 'text-bg-danger', 'text-bg-light border')},
            {type: 'string', render: text},
            {type: 'num'},
            {type: 'string', render: text},
            {type: 'string', render: text}
        ],
        createdRow: function (row, data) {
            if (data[6] === true) {
                row.classList.add('table-danger');
            } else if (data[5] === true) {
                row.classList.add('table-warning');
            }
        }
    });

    // Millions of rows: rows are drawn only when shown, columns have fixed
    // types so nothing is detected, and a large table searches on Enter.
    // Entry rows are [host, share, path, size, modified, tags, kind]; the
    // table lists the files, the listings below also the directories.
    var fileRows = files.filter(function (r) {
        return r[6] !== 'dir';
    });
    new DataTable('#table-files', {
        data: fileRows,
        deferRender: true,
        order: [],
        search: {return: fileRows.length > 100000},
        lengthMenu: [20, 100, 1000],
        columns: [
            {type: 'string', render: text},
            {type: 'string', render: text},
            {type: 'string', render: text, className: 'sf-path'},
            {type: 'num', render: size},
            {type: 'date', render: date},
            {type: 'string', render: text}
        ]
    });

    // By host: each host with its details, its shares, and each listed share
    // as a tree of its folders and files. A folder is drawn the first time it
    // is opened and shows childLimit entries at a time; a small scan opens
    // every folder at once, and Expand all opens a share of up to expandLimit
    // entries, so the page stays fast with millions of files.
    var childLimit = 1000;
    var expandLimit = 5000;
    var smallScan = files.length <= 2000;
    var hostsOpen = hosts.length <= 50;
    // --recurse descends into symlinks and junctions (type link), such as
    // SYSVOL's domain folder, unless --disable-follow-links; the scan record
    // says so, and scans before it did only with --follow-links
    var linksFollowed = summary.follow_links === true || /(^|\s)--follow-links(\s|=|$)/.test(summary.command || '');
    // names sort as Explorer sorts them: file2 before file10, any case
    var collator = new Intl.Collator('en', {numeric: true, sensitivity: 'base'});
    // the class of each tag the scan writes; any other tag gets none
    var tagClass = new Map([['secret', 'sf-tag-secret'], ['script', 'sf-tag-script'], ['config', 'sf-tag-config'],
        ['database', 'sf-tag-database'], ['backup', 'sf-tag-backup']]);

    function el(tag, className, value) {
        var node = document.createElement(tag);
        if (className) {
            node.className = className;
        }
        if (value !== undefined && value !== null) {
            node.textContent = String(value);
        }
        return node;
    }

    // badgeNode is a boolean as a badge with a fixed label
    function badgeNode(value, yes, no, yesClass, noClass) {
        var label = value === true ? yes : value === false ? no : 'Unknown';
        var cls = value === true ? yesClass : value === false ? noClass : 'text-bg-light text-muted border';
        return el('span', 'badge ' + cls, label);
    }

    // smallTable has the given headers; add appends a row of texts or nodes
    function smallTable(headers) {
        var node = el('table', 'table table-sm table-hover mb-2');
        var head = el('tr');
        headers.forEach(function (h) {
            head.appendChild(el('th', '', h));
        });
        node.appendChild(el('thead')).appendChild(head);
        var body = node.appendChild(el('tbody'));
        return {
            node: node,
            add: function (cells, className) {
                var row = el('tr', className);
                cells.forEach(function (cell) {
                    var td = el('td');
                    if (cell instanceof Node) {
                        td.appendChild(cell);
                    } else if (cell !== undefined && cell !== null) {
                        td.textContent = String(cell);
                    }
                    row.appendChild(td);
                });
                body.appendChild(row);
            }
        };
    }

    function key(a, b) {
        return a + '\u0000' + b;
    }

    var sharesOf = new Map(); // host and identity -> share rows
    shares.forEach(function (s) {
        var k = key(s[0], s[10]);
        if (!sharesOf.has(k)) {
            sharesOf.set(k, []);
        }
        sharesOf.get(k).push(s);
    });

    var entries = null; // host and share -> entry rows, made when first needed
    function entriesOf(host, share) {
        if (entries === null) {
            entries = new Map();
            files.forEach(function (r) {
                var k = key(r[0], r[1]);
                if (!entries.has(k)) {
                    entries.set(k, []);
                }
                entries.get(k).push(r);
            });
        }
        return entries.get(key(host, share)) || [];
    }

    function tagsOf(r) {
        return r[5] ? r[5].split(', ') : [];
    }

    // isFile says whether an entry is a file. The scan types any reparse
    // point a link, a deduplicated or cloud-tiered file too: a link with a
    // size is a file, as a directory has none.
    function isFile(r) {
        return r[6] === 'file' || (r[6] === 'link' && r[3] > 0);
    }

    function byName(a, b) {
        return collator.compare(a, b) || (a < b ? -1 : a > b ? 1 : 0);
    }

    // folder is a node of a share's tree. row is its entry: null for the
    // share root and for a folder known only from the paths below it. count,
    // bytes and tags add up the files below it, at any depth.
    function folder(name, row) {
        return {name: name, row: row, dirs: new Map(), files: new Map(), count: 0, bytes: 0, tags: new Set()};
    }

    function addFile(f, size, tags) {
        f.count++;
        f.bytes += size;
        tags.forEach(function (t) {
            f.tags.add(t);
        });
    }

    // buildTree makes the tree of a share's entries. A link that is no file
    // goes with the folders, so one whose target was listed opens like one,
    // and a path written twice, as a scan with several identities writes it,
    // counts once.
    function buildTree(rows) {
        var root = folder('', null);
        rows.forEach(function (r) {
            var parts = r[2].split('/');
            var name = parts.pop();
            var chain = [root];
            var at = root;
            parts.forEach(function (part) {
                var next = at.dirs.get(part);
                if (next === undefined) {
                    next = folder(part, null);
                    at.dirs.set(part, next);
                }
                chain.push(next);
                at = next;
            });
            if (isFile(r)) {
                if (!at.files.has(name)) {
                    at.files.set(name, r);
                    var tags = tagsOf(r);
                    chain.forEach(function (f) {
                        addFile(f, r[3], tags);
                    });
                }
            } else if (r[6] === 'dir' || r[6] === 'link') {
                var node = at.dirs.get(name);
                if (node === undefined) {
                    at.dirs.set(name, folder(name, r));
                } else if (node.row === null) {
                    node.row = r;
                }
            } else if (!at.files.has(name)) {
                at.files.set(name, r); // a kind this report does not know: shown, not counted
            }
        });
        return root;
    }

    // shareStats adds up a share's files as buildTree does, without the tree
    function shareStats(rows) {
        var stats = folder('', null);
        var seen = new Set();
        rows.forEach(function (r) {
            if (isFile(r) && !seen.has(r[2])) {
                seen.add(r[2]);
                addFile(stats, r[3], tagsOf(r));
            }
        });
        return stats;
    }

    function filesText(f) {
        if (f.count === 0) {
            return 'no files';
        }
        return f.count.toLocaleString('en-US') + (f.count === 1 ? ' file · ' : ' files · ') + humanSize(f.bytes);
    }

    // tagsNode shows a file's own tags, or "contains" and the tags of the
    // files below a folder
    function tagsNode(tags, below) {
        var node = el('span', 'sf-tags');
        if (below && tags.length > 0) {
            node.appendChild(el('span', 'sf-contains', 'contains'));
        }
        tags.forEach(function (t) {
            node.appendChild(el('span', 'sf-tag ' + (tagClass.get(t) || '') + (below ? '' : ' sf-own'), t));
        });
        return node;
    }

    // fillRow fills a tree row: a caret when it opens, the icon, the name,
    // then the tags, size and time columns, which line up at every depth
    function fillRow(row, opens, icon, name, kind, tags, size, time) {
        row.appendChild(el('i', opens ? 'bi bi-chevron-right sf-caret' : 'sf-caret'));
        row.appendChild(el('i', 'bi ' + icon + ' sf-icon'));
        var label = row.appendChild(el('span', 'sf-label'));
        label.appendChild(el('span', 'sf-name', name));
        if (kind) {
            label.appendChild(el('span', 'sf-kind', kind));
        }
        row.appendChild(tags);
        row.appendChild(el('span', 'sf-size', size));
        row.appendChild(el('span', 'sf-time', time));
        return row;
    }

    // opened calls draw the first time details is open
    function opened(details, draw) {
        var drawn = false;
        function once() {
            if (!drawn) {
                drawn = true;
                draw();
            }
        }
        details.addEventListener('toggle', function () {
            if (details.open) {
                once();
            }
        });
        return once;
    }

    var drawers = new WeakMap(); // folder or share element -> draws its entries once

    // drawFolder returns a folder that opens when entries were listed in it,
    // and a plain row when none were
    function drawFolder(f) {
        var link = f.row !== null && f.row[6] === 'link';
        var icon = link ? 'bi-link-45deg' : 'bi-folder';
        var kind = link ? 'link' : '';
        var time = f.row !== null ? shortTime(f.row[4]) : '';
        if (f.dirs.size + f.files.size === 0) {
            return fillRow(el('div', 'sf-row sf-leaf'), false, icon, f.name, kind,
                tagsNode(f.row !== null ? tagsOf(f.row) : [], false), '', time);
        }
        var details = el('details', 'sf-node');
        fillRow(details.appendChild(el('summary', 'sf-row')), true, icon, f.name, kind,
            tagsNode(Array.from(f.tags).sort(), true), filesText(f), time);
        var box = details.appendChild(el('div', 'sf-children'));
        drawers.set(details, opened(details, function () {
            drawChildren(box, f);
        }));
        return details;
    }

    function drawFile(name, r) {
        var link = r[6] === 'link';
        return fillRow(el('div', 'sf-row sf-leaf'), false, link ? 'bi-link-45deg' : 'bi-file-earmark', name,
            link ? 'link' : '', tagsNode(tagsOf(r), false), humanSize(r[3]), shortTime(r[4]));
    }

    // drawChildren draws a folder's entries, folders first, childLimit at a
    // time: a button at the end draws the next ones
    function drawChildren(box, f) {
        var dirs = Array.from(f.dirs.keys()).sort(byName);
        var names = Array.from(f.files.keys()).sort(byName);
        var total = dirs.length + names.length;
        var shown = 0;
        function more() {
            var part = document.createDocumentFragment();
            for (var end = Math.min(total, shown + childLimit); shown < end; shown++) {
                part.appendChild(shown < dirs.length ? drawFolder(f.dirs.get(dirs[shown])) :
                    drawFile(names[shown - dirs.length], f.files.get(names[shown - dirs.length])));
            }
            box.appendChild(part);
            if (shown < total) {
                var button = box.appendChild(el('button', 'btn btn-link btn-sm sf-more',
                    'Show more: ' + (total - shown).toLocaleString('en-US') + ' left'));
                button.type = 'button';
                button.addEventListener('click', function () {
                    button.remove();
                    more();
                });
            }
        }
        more();
    }

    // expandAll draws and opens every folder in details
    function expandAll(details) {
        var todo = [details];
        while (todo.length > 0) {
            var d = todo.pop();
            drawers.get(d)();
            d.open = true;
            Array.prototype.forEach.call(d.querySelector(':scope > .sf-children').children, function (c) {
                if (c.matches('details.sf-node')) {
                    todo.push(c);
                }
            });
        }
    }

    function collapseAll(details) {
        details.querySelectorAll('details.sf-node').forEach(function (d) {
            d.open = false;
        });
    }

    // drawShare returns a listed share: the root of its tree, with its access
    // and the files below it, and buttons that open and close every folder
    function drawShare(s, rows) {
        var details = el('details', 'sf-share');
        var stats = shareStats(rows);
        var row = fillRow(details.appendChild(el('summary', 'sf-row sf-share-row')), true, 'bi-hdd-network', s[2], '',
            tagsNode(Array.from(stats.tags).sort(), true), filesText(stats), '');
        var label = row.querySelector('.sf-label');
        if (s[5] === true) {
            label.appendChild(el('span', 'badge text-bg-warning ms-2', 'Read'));
        }
        if (s[6] === true) {
            label.appendChild(el('span', 'badge text-bg-danger ms-1', 'Write'));
        }
        var tools = details.appendChild(el('div', 'sf-tools'));
        var expand = tools.appendChild(el('button', 'btn btn-outline-secondary btn-sm sf-expand', 'Expand all'));
        var collapse = tools.appendChild(el('button', 'btn btn-outline-secondary btn-sm sf-collapse', 'Collapse all'));
        expand.type = 'button';
        collapse.type = 'button';
        if (rows.length > expandLimit) {
            expand.disabled = true;
            tools.appendChild(el('span', 'text-muted small', 'Over ' + expandLimit.toLocaleString('en-US') +
                ' entries: open folders one by one, or search the Files table.'));
        }
        if (!linksFollowed && rows.some(function (r) {
            return r[6] === 'link';
        })) {
            details.appendChild(el('p', 'text-muted small', 'Links were not followed: scan without ' +
                '--disable-follow-links to list what they point to.'));
        }
        var box = details.appendChild(el('div', 'sf-children'));
        drawers.set(details, opened(details, function () {
            drawChildren(box, buildTree(rows));
        }));
        expand.addEventListener('click', function () {
            expandAll(details);
        });
        collapse.addEventListener('click', function () {
            collapseAll(details);
        });
        return details;
    }

    function drawHost(card, h) {
        // h: ip, hostname, domain, os, signing, dialect, session, admin, shares, identity
        card.appendChild(el('h6', 'pt-2', 'Host details'));
        var info = smallTable(['Hostname', 'Domain', 'OS', 'Signing', 'Dialect', 'Session', 'Admin', 'Identity']);
        info.add([h[1], h[2], h[3], badgeNode(h[4], 'Required', 'Not required', 'text-bg-success', 'text-bg-warning'),
            h[5], h[6], badgeNode(h[7], 'Yes', 'No', 'text-bg-danger', 'text-bg-secondary'), h[9]]);
        card.appendChild(info.node);

        var own = sharesOf.get(key(h[0], h[9])) || [];
        card.appendChild(el('h6', 'pt-2', 'Shares'));
        if (own.length === 0) {
            card.appendChild(el('p', 'text-muted', 'No shares.'));
            return;
        }
        var list = smallTable(['Share', 'Remark', 'Type', 'Read', 'Write', 'Write access', 'Files', 'Notes']);
        own.forEach(function (s) {
            list.add([s[2], s[3], s[4], badgeNode(s[5], 'Yes', 'No', 'text-bg-warning', 'text-bg-light border'),
                badgeNode(s[6], 'Yes', 'No', 'text-bg-danger', 'text-bg-light border'), s[7], s[8], s[9]],
            s[6] === true ? 'table-danger' : s[5] === true ? 'table-warning' : '');
        });
        card.appendChild(list.node);

        var listed = own.filter(function (s) {
            return entriesOf(s[0], s[2]).length > 0;
        });
        if (listed.length === 0) {
            return;
        }
        card.appendChild(el('h6', 'pt-2', 'Listing'));
        var tree = card.appendChild(el('div', 'sf-tree'));
        listed.forEach(function (s) {
            var share = tree.appendChild(drawShare(s, entriesOf(s[0], s[2])));
            if (smallScan) {
                expandAll(share);
            }
        });
    }

    var byHost = document.getElementById('sf-details');
    if (hosts.length === 0) {
        byHost.appendChild(el('p', 'text-muted', 'No hosts.'));
    }
    hosts.forEach(function (h) {
        var card = el('details', 'sf-host');
        card.appendChild(el('summary', '', h[1] ? h[0] + ' (' + h[1] + ')' : h[0]));
        var draw = opened(card, function () {
            drawHost(card, h);
        });
        if (hostsOpen) {
            draw();
            card.open = true;
        }
        byHost.appendChild(card);
    });
})();
</script>

<footer class="footer">
    <div class="container">
        <p class="text-muted">
            This report was generated by <a href="https://github.com/vflame6/sharefinder">sharefinder</a>.
